[version]
main  = 1
minor = 0

[ddr]
width = 32
# MHz
clk   = 672

[init]
# refer to dp_hal_src_id_t
# 0: Dummy,
# 1: VideoDecoder,
# 2: HDMI1, 3: HDMI2, 4: HDMI3,
# 5: CVBS1, 6: CVBS2, 7: CVBS3,
# 8: ATV,
source_id = 0

# Backlight Work Mode
# 0: Manual Dimming,
# 1: Zero Dimming,
# 2: Local Dimming,
# 3: Dolby Vision
backlight_mode  = 0
backlight_level = 100

# aw will call dp_hal_gamma_set_cfg when system init
init_gamma = 0

[hdmirx]
# thread scheduled time
# min 1ms
# max 100ms
scheduled_ms = 10

# auto equalizer enable or disable
auto_eq = 1

# equalizer peaking stages
eq_ab_val_00 = 0
eq_ab_val_08 = 36
eq_ab_val_04 = 876
eq_ab_val_12 = 42

eq_c_val_00 = 0
eq_c_val_08 = 22
eq_c_val_04 = 762
eq_c_val_12 = 46

# phase mode
#  0: USE_BEST_NEAR,
#  1: USE_FIX_PHASE,
#  2: USE_AVG_PHASE,
#  3: USE_BEST_PHASE
phase_mode = 2

# constant for USE_AVG_PHASE mode
avg_phase_const = 50

[logger]
# level: 0/1/2/3/4/5
#  0: NONE
#  1: ERROR
#  2: WARN
#  3: INFO
#  4: DEBUG
#  5: VERBOSE
enable = 1
level  = 2
async  = 1
logcat = 1

[logger.tag]
#bs = 3
#app = 3
#hal = 4
#hdmirx = 4
#hdmirx_drv = 4

[logger.file]
file = /tmp/vsdp.log
size = 1024

[drm]
hdmi = 0
vdd  = 0
